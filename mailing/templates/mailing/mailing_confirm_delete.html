{% extends 'mailing/base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Подтвердите удаление</h4>
            </div>
            <div class="card-body text-center">
                <p class="fs-5">Вы действительно хотите удалить этот объект?</p>
                <p class="text-muted">Это действие нельзя будет отменить.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <button type="submit" class="btn btn-danger px-4">Да, удалить</button>
                        <a href="javascript:history.back()" class="btn btn-secondary px-4">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
