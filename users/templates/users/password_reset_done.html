{% extends 'mailing/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow text-center">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Письмо отправлено</h3>
                </div>
                <div class="card-body">
                    <p class="card-text">
                        Мы отправили вам инструкции по восстановлению пароля на указанный адрес электронной почты.
                        Если письмо не пришло, проверьте папку «Спам».
                    </p>
                    <a href="{% url 'users:login' %}" class="btn btn-outline-primary mt-3">Вернуться к входу</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
