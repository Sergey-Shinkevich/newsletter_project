{% extends 'mailing/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Восстановление пароля</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted">
                        Забыли пароль? Укажите ваш email, и мы отправим вам инструкции по его восстановлению.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 mt-3">Сбросить пароль</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
