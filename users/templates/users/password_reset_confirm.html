{% extends 'mailing/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Введите новый пароль</h3>
                </div>
                <div class="card-body">
                    {% if validlink %}
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-success w-100 mt-3">Сохранить новый пароль</button>
                        </form>
                    {% else %}
                        <div class="alert alert-danger" role="alert">
                            Ссылка для восстановления пароля недействительна или устарела.
                            Пожалуйста, запросите сброс пароля повторно.
                        </div>
                        <a href="{% url 'users:password_reset' %}" class="btn btn-primary w-100">Запросить снова</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
